[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "firescope-ai"
version = "0.1.0"
description = "NASA FIRMS data foundation for FireScope AI"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<2", "pydantic>=2,<3", "fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "mypy>=1.10,<2", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
